# ─────────────────────────────────────────────────────────────
#  내 운세 알림 설정 — 이 파일 하나만 고치면 됩니다
#  고친 뒤 점검: Actions에서 dry_run을 체크해 수동 실행 → 실행 기록의 '내 명식 점검 (me.yaml)' 단계 (README '파이썬이 없어도 점검하는 법')
#  이 저장소는 반드시 비공개(Private)로 두세요 — 생년월일시가 들어 있습니다.
#  예시 인물 '하늘'·'바다'는 지어낸 사람입니다. 내 정보로 바꿔 쓰세요.
# ─────────────────────────────────────────────────────────────

# model: claude-sonnet-5-5  # 해석 모델을 바꿀 때만 #와 그 뒤 공백 한 칸을 지우고 적습니다(없으면 코드 기본값 interpret.DEFAULT_MODEL)

people:                     # 운세를 받을 사람들 — 맨 위가 나(본인)입니다
  - name: 하늘               # 이름 — 로그와 최근 발송문 파일(state/recent_하늘.json)에 쓰입니다. 사람마다 달라야 합니다
    birth:
      date: 1992-03-14      # 생년월일(양력) YYYY-MM-DD — 음력으로 알고 있으면 양력으로 바꿔 적습니다
      time: 10:10           # 태어난 시각 HH:MM(24시간제, 오후 3시 5분이면 15:05) — 모를 때는 README '출생 시각을 모를 때'
      place: 대전            # 태어난 시 이름 — 목록(README '지역 목록')에 없으면 아래 lat·lon 줄의 #와 그 뒤 공백 한 칸을 지우고 적습니다
      # lat: 36.35          # 위도 — 지역 목록에 없는 곳일 때만
      # lon: 127.38         # 경도 — lat과 함께 적습니다
    gender: 여               # 여 또는 남 — 대운(10년 흐름)이 흐르는 방향이 이 값으로 정해집니다
    hour_rule: A            # 자시(밤 11시~새벽 1시) 경계 관례 A·B·C — 모르면 A (README '자시 경계와 세 가지 관례')
    chat: me                # 받을 곳 — me면 시크릿 TELEGRAM_CHAT_ID(내 텔레그램)로 보냅니다
    honorific: ""           # 메시지에서 부를 호칭(예: 하늘님) — 비우면 부르지 않습니다

  # 가족·친구를 더하려면 아래 줄들의 #와 그 뒤 공백 한 칸을 지우고 고칩니다 (순서는 ADDING_A_RECIPIENT.md)
  # - name: 바다
  #   birth:
  #     date: 1988-07-09
  #     time: 23:40         # 바다처럼 밤 11시대 출생이면 관례에 따라 일주가 갈립니다 — 점검 출력에서 세 후보를 봅니다
  #     place: 부산
  #   gender: 남
  #   hour_rule: A
  #   chat: bada            # FORTUNE_CHAT_IDS 시크릿의 "bada" 칸으로 보냅니다(me로 두면 내 텔레그램으로 함께 옵니다)
  #   honorific: ""
