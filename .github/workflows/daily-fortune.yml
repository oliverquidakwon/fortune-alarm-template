name: daily-fortune

# 매일 아침 운세 알림 — me.yaml의 사람마다 오늘 운세를 만들어 텔레그램으로 보낸다.
# 예약 시각(UTC): 21:47 = 한국 06:47 본 발송 · 22:17 = 한국 07:17 예비(이미 보냈으면 같은 날 가드로 건너뜀).
# 매시 정각은 Actions가 붐비는 시각이라 피했다 — 예약 실행은 늦거나 빠질 수 있다(README '보내는 시각').
on:
  schedule:
    - cron: '47 21 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:          # Actions 탭의 Run workflow 버튼(수동 실행)
    inputs:
      dry_run:
        description: '해석만 만들어 로그에 보여 주기 (텔레그램 발송·state 저장 안 함)'
        type: boolean
        default: false

permissions:
  contents: write             # state/ (최근 발송문) 자동 커밋 — 다음날 같은 문장 틀 반복을 피한다

# 예약 실행과 수동 실행이 겹치면 뒤의 것이 기다린다(진행 중인 발송을 끊지 않는다).
concurrency:
  group: daily-fortune
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 이벤트 시점이 아니라 그 시점 브랜치 최신 — 기다린 실행이 앞 실행의 state 커밋을 보게 한다
          ref: ${{ github.ref }}
          persist-credentials: false   # 쓰기 토큰을 git 설정에 남기지 않는다 — 아래 Commit state 스텝만 받는다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        id: deps
        run: pip install -r requirements.txt

      # 내 명식 점검 — 네 기둥·관례별 후보·대운·별자리 세 축·확인 필요를 이 기록에 남긴다(파이썬 없이 웹에서 점검).
      # me.yaml이 잘못됐으면 여기서 고칠 말 한 문장과 함께 멈춘다. 계산만 하니 비밀값은 주지 않는다.
      - name: 내 명식 점검 (me.yaml)
        id: chart
        run: python -X utf8 me_config.py

      # 테스트가 하나라도 깨지면 아래 발송은 돌지 않는다(실패 알림만 간다). 비밀값은 이 스텝에 주지 않는다.
      - name: Run tests
        id: tests
        run: python -X utf8 -m pytest -q

      # 종료 코드: 0 정상 / 1 맨 위 사람(본인) 실패 / 2 일부 사람만 실패.
      # 2를 여기서 흡수하는 이유 — 그대로 실패시키면 아래 Commit state가 건너뛰어져
      # 성공한 사람의 state까지 저장되지 않는다. 커밋 뒤 Flag 스텝에서 실패로 표시한다.
      - name: Send daily fortune
        id: send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORTUNE_CHAT_IDS: ${{ secrets.FORTUNE_CHAT_IDS }}    # 선택 — 가족·친구 chat id JSON
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -X utf8 run_daily.py ${{ inputs.dry_run && '--dry-run' || '' }}
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning::일부 사람만 실패 — state 커밋 뒤 Flag 스텝에서 실패로 표시한다"
            exit 0
          fi
          exit $code

      # 오늘 발송문을 state/recent_<이름>.json(사람별 최근 7일)에 반영 — 다음날 프롬프트가 읽는다
      # 본인 실패로 Send가 실패한 날에도 돈다 — 보낸 가족의 state를 남겨야 07:17 예비 실행이 그 사람에게 다시 보내지 않는다
      - name: Commit state
        id: commit
        if: (success() || steps.send.outcome == 'failure') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}    # 저장소 쓰기 토큰은 이 스텝에만 준다(로그에는 가려져 찍힌다)
        run: |
          if [ ! -d state ]; then echo "state 폴더 없음 — 커밋할 것 없음"; exit 0; fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state/
          if git diff --staged --quiet; then echo "바뀐 state 없음"; exit 0; fi
          git commit -m "fortune state $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            git push "$remote" "HEAD:${GITHUB_REF_NAME}" && break
            if [ "$i" -eq 3 ]; then echo "::error::state push 3회 실패"; exit 1; fi
            sleep $((i * 5)); git pull --rebase "$remote" "${GITHUB_REF_NAME}" || true
          done

      - name: Flag partial failure
        id: flag
        if: steps.send.outputs.code == '2'
        run: |
          echo "::error::일부 사람의 발송이 실패했다 — Send daily fortune 로그의 [이름] 줄을 확인"
          exit 1

      # 실패 알림 — 위 스텝 중 하나라도 실패하거나 실행이 취소되면(시간 제한 포함) 내 텔레그램으로 한 줄. 응답의 ok까지 확인한다.
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: "deps:${{ steps.deps.outcome }} chart:${{ steps.chart.outcome }} tests:${{ steps.tests.outcome }} send:${{ steps.send.outcome }} commit:${{ steps.commit.outcome }} flag:${{ steps.flag.outcome }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="[운세 알림] 실패 $(TZ=Asia/Seoul date +'%m/%d %H:%M') KST — ${STATUS} — ${RUN_URL}"
          RESP_FILE="${RUNNER_TEMP}/telegram-alert-resp.json"
          curl -sS --retry 4 --retry-delay 15 --retry-all-errors --max-time 30 -o "$RESP_FILE" \
            -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${TEXT}" || true
          python3 - "$RESP_FILE" <<'PY'
          import json, sys
          try:
              r = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception as e:
              print("telegram 응답을 읽지 못했다:", type(e).__name__)
              sys.exit(1)
          print("telegram ok:", r.get("ok"), r.get("description", ""))
          sys.exit(0 if r.get("ok") else 1)
          PY
